<title>Trigon6 Panel Spacing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Archivo:wght@500;600;700&family=Archivo+Narrow:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: three columns that grow to the same height, no fixed section sizes. Each row centres its controls on one line and puts value and label right under each control. Single dark look, as the hardware. */
:root {
  --bg: #0b0b0c;
  --win: #121214;
  --sec: #18181a;
  --edge: #2e2e32;
  --text: #e8e8ea;
  --mute: #8a8a92;
  --label: #dcdce0;
  --name: #8d8d95;
  --led: #ff3b1f;
  --orange: #84848c;
  --font-display: "Michroma", "Eurostile", "Arial Black", sans-serif;
  --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-label: "Archivo Narrow", "Archivo", Arial, sans-serif;
  --font-lcd: "Share Tech Mono", "Consolas", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text); font: 400 14px/1.5 var(--font-body);
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.page { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.note { margin: 0; color: var(--mute); max-width: 80ch; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.sw { width: 18px; height: 5px; border-radius: 3px; background: #f2f2f2; }
.sw.o { background: var(--orange); }
.sw.d { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
.fit { width: 100%; }
.panel { position: relative; width: 1426px; transform-origin: 0 0; background: var(--win); border: 1px solid var(--edge); border-radius: 4px; padding: 52px 30px 8px; display: grid; grid-template-columns: 412px 540px minmax(0, 1fr); gap: 8px; align-items: stretch; }
.panel, .panel * { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
.panel :focus, .panel :focus-visible { outline: none !important; }
.panel svg, .panel button { -webkit-user-drag: none; }
.panel::before, .panel::after { content: ""; position: absolute; top: 0; bottom: 0; width: 22px; z-index: 2; pointer-events: none; }
.panel::before { left: 0; border-radius: 4px 0 0 4px; background: repeating-linear-gradient(180deg, rgba(110, 70, 25, .10) 0 1px, rgba(0, 0, 0, 0) 1px 6px), repeating-linear-gradient(180deg, rgba(255, 255, 255, .09) 0 2px, rgba(0, 0, 0, 0) 2px 13px), linear-gradient(90deg, #e8d2a3, #d8bc86 55%, #c6a36c); box-shadow: inset -7px 0 9px -4px rgba(0, 0, 0, .5); }
.panel::after { right: 0; border-radius: 0 4px 4px 0; background: repeating-linear-gradient(180deg, rgba(110, 70, 25, .10) 0 1px, rgba(0, 0, 0, 0) 1px 6px), repeating-linear-gradient(180deg, rgba(255, 255, 255, .09) 0 2px, rgba(0, 0, 0, 0) 2px 13px), linear-gradient(270deg, #e8d2a3, #d8bc86 55%, #c6a36c); box-shadow: inset 7px 0 9px -4px rgba(0, 0, 0, .5); }
.col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

.bar { position: absolute; inset: 0 22px auto 22px; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--edge); background: #0f0f10; }
.brand { font: 400 12px/1 var(--font-display); letter-spacing: .18em; }
.tabs { display: flex; gap: 2px; }
.tab { font: 600 12px/1 var(--font-label); letter-spacing: .08em; text-transform: uppercase; padding: 8px 11px; color: var(--mute); border-radius: 3px; }
.tab.on { background: #26262a; color: var(--text); }
.sp { flex: 1; }
.bar label { font: 600 11px/1 var(--font-label); letter-spacing: .08em; color: #b8b8bc; text-transform: uppercase; }
.ch { font: 500 13px/1 var(--font-lcd); background: #050506; color: var(--led); border: 1px solid #000; padding: 6px 10px; border-radius: 2px; }
.pb { font: 600 11px/1 var(--font-label); letter-spacing: .08em; text-transform: uppercase; color: var(--text); background: #26262a; border: 1px solid #0a0a0b; border-radius: 3px; padding: 9px 14px; cursor: pointer; box-shadow: inset 0 1px 0 #3c3c42; }
.pb:disabled { color: #5c5c62; cursor: default; box-shadow: none; }
.pb.hot:not(:disabled) { color: #fff; background: #303034; border-color: #5a5a60; box-shadow: inset 0 1px 0 #6e6e74; }
.pb:focus-visible, .tog:focus-within { outline: 2px solid #ffffff55; outline-offset: 2px; }
.tog { display: inline-flex; gap: 8px; align-items: center; font: 600 11px/1 var(--font-label); letter-spacing: .08em; text-transform: uppercase; color: var(--label); cursor: pointer; }
.tog input { accent-color: var(--orange); width: 15px; height: 15px; }
.status { font: 500 12px/1 var(--font-label); color: #b8b8bc; }

.sec { background: var(--sec); border: 1px solid var(--edge); display: flex; flex-direction: column; padding: 8px 12px 12px; min-width: 0; flex: 1 1 auto; }
.subrow { display: flex; gap: 8px; flex: 1 1 auto; min-width: 0; }
.sec > h3 { margin: 0; text-align: center; font: 400 11px/1 var(--font-display); letter-spacing: .2em; text-transform: uppercase; color: #ececee; padding: 4px 0 0; }
.sec.big > h3 { font-size: 15px; letter-spacing: .24em; padding: 6px 0 0; }
.rows { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding-top: 12px; }
.row { display: grid; align-items: start; }
.cell { padding-top: calc((var(--h) - var(--c)) / 2); display: flex; flex-direction: column; align-items: center; min-width: 0; }
.cell .ctl { height: var(--c); width: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
.val { font: 500 13px/1.1 var(--font-label); font-variant-numeric: tabular-nums; color: #f1f1f3; margin-top: -5px; }
.lab { font: 700 10.5px/1.15 var(--font-label); letter-spacing: .07em; text-transform: uppercase; color: var(--name); text-align: center; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.blank { visibility: hidden; }
.vsep { width: 1px; height: 78px; background: #34343a; align-self: center; justify-self: center; }
.lab.on { color: #f1f1f3; }
.cell:has(.leds.col) .lab { margin-top: 0; }
.cell .ctl.blk { align-items: flex-start; }
.blkgrid { display: grid; }
.blkgrid .cell { min-width: 0; }
.blkgrid .lab { letter-spacing: .02em; }


.knob { width: var(--k); height: var(--k); touch-action: none; cursor: ns-resize; border-radius: 50%; outline: none; display: block; }
.btn { width: 22px; height: 22px; border-radius: 3px; border: 1px solid #060607; background: linear-gradient(#3a3a3e, #26262a); box-shadow: inset 0 1px 0 #4d4d52; cursor: pointer; padding: 0; flex: none; }
.btn.on { background: linear-gradient(#ff7a32, #e24a12); box-shadow: 0 0 9px #ff5a1a77, inset 0 1px 0 #ffa27a; }
.btn:focus-visible, .win:focus-visible, .ledcol:focus-visible, .led:focus-visible, .dd:focus-visible { outline: 2px solid #ffffff66; outline-offset: 2px; }
.leds.col { display: flex; flex-direction: column; align-items: stretch; gap: 0; }
.ledrow { display: flex; gap: 9px; justify-content: center; }
.led { display: flex; flex-direction: column; align-items: center; gap: 9px; cursor: pointer; font: 600 9.5px/1 var(--font-label); color: #c6c6ca; background: none; border: 0; padding: 2px 1px; }
.led i, .ledcol i { width: 7px; height: 7px; border-radius: 50%; background: #3a1410; box-shadow: inset 0 0 0 1px #00000088; position: relative; flex: none; }
.led.on i, .ledcol.on i { background: var(--led); box-shadow: 0 0 7px var(--led), inset 0 0 0 1px #ff8a70; }
.led.pre i, .ledcol.pre i { background: #55555b; box-shadow: 0 0 4px #ffffff1c, inset 0 0 0 1px #8a8a92; }
.ledcol { display: flex; align-items: center; gap: 11px; cursor: pointer; font: 600 10.5px/1 var(--font-label); letter-spacing: .04em; color: #c6c6ca; background: none; border: 0; padding: 0; height: 16.8px; text-align: left; white-space: nowrap; }
.ledcol.on { color: #fff; }
.win { font: 400 12.5px/1 var(--font-lcd); background: #050506; color: var(--led); border: 1px solid #000; box-shadow: inset 0 1px 3px #000; border-radius: 2px; padding: 7px 6px; width: max-content; min-width: 56px; max-width: 100%; text-align: center; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.saw { position: relative; display: flex; }
.saw .two { position: absolute; left: 50%; bottom: calc(100% + 25px); transform: translateX(-50%); display: flex; gap: 14px; }
.saw .two i { width: 7px; height: 7px; border-radius: 50%; background: #3a1410; box-shadow: inset 0 0 0 1px #00000088; }
.saw .two i.on { background: var(--led); box-shadow: 0 0 7px var(--led), inset 0 0 0 1px #ff8a70; }
.anchor { position: relative; display: inline-flex; max-width: 100%; }
.anchor .dd { top: 0; right: 0; transform: translate(62%, -62%); }
.anchor.out .dd { transform: translate(150%, -10%); }
.gl { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); display: flex; gap: 9px; color: #d0d0d5; line-height: 0; pointer-events: none; }
.gl svg { width: 12px; height: 12px; display: block; }
.anchor.br .dd { top: auto; bottom: 0; transform: translate(62%, 62%); }
.dd { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--orange); border: 0; padding: 0; cursor: pointer; box-shadow: 0 0 0 3px var(--sec); }
.oct { overflow: visible; width: 96px; height: 88px; display: block; cursor: pointer; touch-action: manipulation; }
.env { width: 100%; height: 62px; display: block; border-radius: 2px; touch-action: none; }
.leds.grid2 { display: grid; grid-template-columns: auto auto; gap: 0; }
.leds.grid2 .ledcol { white-space: nowrap; }
.leds.grid2 .ledcol:nth-child(odd) { padding-right: 16px; }
.menu { position: absolute; z-index: 50; background: #0a0a0b; border: 1px solid #3a3a3e; border-radius: 3px; padding: 4px; box-shadow: 0 10px 28px #000c; max-height: 640px; overflow: auto; min-width: 120px; }
.menu[hidden] { display: none; }
.mi { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; color: #cfcfd4; font: 600 14px/1 var(--font-body); padding: 9px 14px 9px 10px; cursor: pointer; text-align: left; border-radius: 2px; white-space: nowrap; }
.mi:hover { background: #232327; }
.mi i { width: 8px; height: 8px; border-radius: 50%; background: #3a1410; box-shadow: inset 0 0 0 1px #00000088; flex: none; }
.mi.on { color: #fff; }
.mi.on i { background: var(--led); box-shadow: 0 0 7px var(--led), inset 0 0 0 1px #ff8a70; }
.mi.pre i { background: #55555b; box-shadow: 0 0 4px #ffffff1c, inset 0 0 0 1px #8a8a92; }
.mi small.d { text-transform: none; letter-spacing: 0; font: 500 12px/1 var(--font-body); }
.mi small { margin-left: auto; padding-left: 18px; font: 500 11px/1 var(--font-label); letter-spacing: .06em; text-transform: uppercase; color: var(--name); }
.prog { display: flex; align-items: center; gap: 6px; }
.pg { width: 26px; height: 30px; background: #26262a; border: 1px solid #0a0a0b; border-radius: 3px; color: #cfcfd3; cursor: pointer; font-size: 11px; box-shadow: inset 0 1px 0 #3c3c42; }
.pdisp { display: flex; align-items: baseline; gap: 10px; min-width: 232px; background: #050506; border: 1px solid #000; box-shadow: inset 0 1px 3px #000; border-radius: 2px; padding: 6px 12px; cursor: pointer; color: #f1f1f3; font: 600 14px/1.2 var(--font-body); text-align: left; }
.pn { font: 400 13px/1 var(--font-lcd); color: var(--led); }
.pnm { flex: 1; white-space: nowrap; }
.pc { font: 500 11px/1 var(--font-label); color: var(--name); text-transform: uppercase; letter-spacing: .06em; }
.hint { font-size: 13px; color: var(--mute); margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>

<div class="page">
  <div class="fit" id="fit"><div class="panel" id="panel"></div></div>
  <p class="hint">Hover a control for the saved and current value. "Get sound" stands in for reading the synth: it makes the current panel the saved sound.</p>

<script>

      });

      inst.draw = function () {

    } else if (p.kind === "bool") {

    } else if (id === "clock_divide") {

      });

    } else if (COLUMN[id]) {

        li.lastChild.textContent = name; li.addEventListener("click", function () { setV(id, i); }); c.appendChild(li); return li;
      });
      ctl.appendChild(c); inst.c = Math.max(5, p.ch.length) * 17;
      inst.draw = function () { items.forEach(function (li, i) { li.classList.toggle("on", V[id] === i); li.classList.toggle("pre", diffOf(id) && S[id] === i); }); };
    } else if (OCTAVE[id]) {
      /* a cap with the choices on an arc above it, as on the synth */
      var os = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      os.setAttribute("class", "oct"); os.setAttribute("viewBox", "0 0 100 92"); os.setAttribute("role", "group"); os.setAttribute("aria-label", p.name);
      var base = [-70, -35, 0, 35, 70], angles = p.ch.length === 6 ? [-105].concat(base) : base;
      os.addEventListener("click", function (e) {
        var t = e.target.closest ? e.target.closest("[data-i]") : null;
        if (t) setV(id, +t.getAttribute("data-i")); else setV(id, (V[id] + 1) % p.ch.length);
      });
      os.addEventListener("dblclick", function () { setV(id, S[id]); });
      ctl.appendChild(os); inst.c = 88; inst.octave = true;
      valEl = mk("div", "val"); valEl.innerHTML = "&nbsp;";
      inst.draw = function () {
        var h = "", cx = 50, cy = 46;
        p.ch.forEach(function (name, i) {
          var a = angles[i], q = P(a, 29, cx, cy), on = V[id] === i, pre = diffOf(id) && S[id] === i, tx, ty, anchor = "middle";

    } else if (LEDROW[id]) {

        li.addEventListener("click", function () { setV(id, i); }); r.appendChild(li); return li;
      });
      ctl.appendChild(r); inst.c = 30;
      inst.draw = function () { its.forEach(function (li, i) { li.classList.toggle("on", V[id] === i); li.classList.toggle("pre", diffOf(id) && S[id] === i); }); };
    } else {
      var wn = mk("button", "win"); wn.type = "button"; wn.setAttribute("aria-label", p.name + ": click to choose");
      var names = DISPLAY[id] || p.ch;
      wn.addEventListener("click", function () {
        openMenu(wn, names.map(function (n, i) { var d = DESCRIBE[id] && DESCRIBE[id][i]; return d ? { t: n, s: d, d: true } : { t: n }; }), V[id] - p.min, showDiff && S[id] !== V[id] ? S[id] - p.min : -1, function (i) { setV(id, p.min + i); });
      });
      ctl.appendChild(wn); inst.c = 28;
      inst.draw = function () { wn.textContent = names[V[id] - p.min]; };
    }

    if (valEl) el.appendChild(valEl);
    label.textContent = shortName(p); el.appendChild(label);
    if (WAVE.test(id)) label.style.display = "none";

    if (p.kind !== "int" && p.kind !== "bip" && !OCTAVE[id] && !COLUMN[id] && !LEDROW[id] && id !== "clock_divide") {
      var dd = mk("button", "dd"); dd.type = "button"; dd.hidden = true;
      dd.setAttribute("aria-label", "Put " + p.name + " back to the preset");
      dd.addEventListener("click", function () { setV(id, S[id]); });
      var main = ctl.firstChild, an = mk("span", "anchor" + (p.kind === "saw" || WAVE.test(id) ? " br" : ""));
      if (WAVE.test(id) && p.kind !== "saw") an.appendChild(glyph([id.split("_")[1]]));
      ctl.insertBefore(an, main); an.appendChild(main); an.appendChild(dd); inst.dd = dd;
    }
    var baseDraw = inst.draw;
    inst.draw = function () {
      baseDraw();
      if (inst.dd) inst.dd.hidden = !diffOf(id);

    };
    cells[id] = inst; el.setAttribute("data-id", id);
    return inst;
  }

  function refresh(id) {
    if (/^fx[ab]_type$/.test(id)) fxRanges();
    cells[id].draw(); if (id === "lfo_sync") cells.lfo_freq.draw();
    var fm = /^fx([ab])_(type|sync)$/.exec(id); if (fm) { cells["fx" + fm[1] + "_param1"].draw(); cells["fx" + fm[1] + "_param2"].draw(); }
    envs.forEach(function (e) { e.draw(); }); updateBar(); }
  function refreshAll() { fxRanges(); ORDER.forEach(function (id) { cells[id].draw(); }); envs.forEach(function (e) { e.draw(); }); updateBar(); }

  /* ---- build the window ---- */
  var bar = mk("div", "bar");
  bar.innerHTML = '<span class="brand">TRIGON6 CONTROL</span>' +
    '<div class="tabs" aria-hidden="true"><span class="tab on">Panel</span><span class="tab">Presets</span><span class="tab">Connection</span></div>' +
    '<div class="prog"><button class="pg" id="progPrev" type="button" aria-label="Previous program">\u25C0</button><button class="pdisp" id="progDisp" type="button" aria-label="Choose a program"><span class="pn" id="progNum"></span><span class="pnm" id="progName"></span><span class="pc" id="progCat"></span></button><button class="pg" id="progNext" type="button" aria-label="Next program">\u25B6</button></div>' +
    '<span class="sp"></span>' +
    '<label class="tog" for="showDiff"><input type="checkbox" id="showDiff" checked> Show differences</label>' +
    '<label>MIDI ch</label><span class="ch">1</span>' +
    '<button class="pb" id="getSound" type="button" title="Reads the sound from the synth; the panel becomes the saved sound">Get sound</button>' +
    '<button class="pb hot" id="resetAll" type="button">Reset to preset</button>';
  panel.appendChild(bar);

  COLS.forEach(function (secs, ci) {
    var col = mk("div", "col");
    function buildSec(sec, sub) {
      var d = sub ? mk("div", "sub") : mk("section", "sec" + (BIG[sec[0]] ? " big" : "") + (ci === 0 ? " dense" : ""));
      var h = mk("h3"); h.textContent = sec[0]; d.appendChild(h);
      var KS = { Oscillators: 76, Filter: 62, Effects: 56, Seq: 60, Arp: 60, Clock: 60, Master: 64, PolyMod: 54, Aftertouch: 54, LFO: 54, "Glide / Unison": 54 }, rows = mk("div", "rows"), kSize = KS[sec[0]] || 52;
      d.style.setProperty("--k", kSize + "px");
      if (sec[0] === "LFO") rows.style.gap = "14px";
      sec[1].forEach(function (row, ri) {
        var r = mk("div", "row"), insts = [], isPos = !Array.isArray(row), ids = isPos ? row.at.map(function (a) { return a[0]; }) : row;
        ids.forEach(function (id, k) {
          if (!id) { var bl = mk("div", "cell blank"); r.appendChild(bl); insts.push(null); return; }
          if (id === "sep") { r.appendChild(mk("div", "vsep")); insts.push(null); return; }
          var inst = id.indexOf("env:") === 0 ? makeEnv(id.slice(4), id === "env:fenv" ? "Filter" : "Amp") : id.indexOf("blk:") === 0 ? makeBlock(id.slice(4), false) : id.indexOf("blkk:") === 0 ? makeBlock(id.slice(5), true) : makeCell(id);
          if (inst.c == null) inst.c = kSize;
          inst.el.style.setProperty("--c", inst.c + "px");
          inst.el.querySelector(".ctl").style.setProperty("--c", inst.c + "px");
          if (isPos) { var at = row.at[k]; inst.el.style.gridArea = "1 / 1"; inst.el.style.justifySelf = "start"; inst.el.style.marginLeft = (at[1] - at[2] / 2) + "px"; inst.el.style.width = at[2] + "px"; }
          r.appendChild(inst.el); insts.push(inst);
        });
        var hh = Math.max.apply(null, insts.map(function (i) { return i ? Math.max(i.c, i.h || 0) : 0; })), hasBlk = insts.some(function (i) { return i && i.h; });
        r.style.setProperty("--h", hh + "px");
        insts.forEach(function (i) { if (i && (i.knob || i.octave) && !hasBlk) { i.el.style.setProperty("--c", hh + "px"); i.el.querySelector(".ctl").style.setProperty("--c", hh + "px"); } });
        var custom = (sec[3] && sec[3][ri]) || sec[2] || null;
        if (isPos) { r.style.gridTemplateColumns = row.w + "px"; r.style.justifyContent = "center"; }
        else r.style.gridTemplateColumns = custom || "repeat(" + ids.length + ",minmax(0,1fr))";
        rows.appendChild(r);
      });
      d.appendChild(rows); return d;
    }
    secs.forEach(function (sec) {
      if (sec.multi) {
        var m = mk("div", "subrow");
        sec.subs.forEach(function (sb) { var e = buildSec(sb); e.style.flex = (sb[4] || 1) + " 1 0"; m.appendChild(e); });
        col.appendChild(m);
      } else col.appendChild(buildSec(sec));

    panel.appendChild(col);
  });

  var resetBtn = document.getElementById("resetAll");
  function count() { var n = 0; ORDER.forEach(function (id) { if (S[id] !== V[id]) n++; }); return n; }
  function updateBar() {
    var n = count();
    resetBtn.disabled = !(showDiff && n > 0);
    resetBtn.textContent = n > 0 ? "Reset to preset (" + n + ")" : "Reset to preset";
  }
  var progIdx = 0;
  function showProgram() {
    var q = PROGRAMS[progIdx];
    document.getElementById("progNum").textContent = q[0]; document.getElementById("progName").textContent = q[1]; document.getElementById("progCat").textContent = q[2];
  }
  function loadProgram(i) {
    progIdx = (i + PROGRAMS.length) % PROGRAMS.length;

    ORDER.forEach(function (id) {
      var q = T[id], x = r(), v;

  /* ---- scale the window to the viewer ---- */
  var VISIBLE = "svg.knob, .btn, .win, .ledcol, .led, svg.env, svg.oct, .lab, .val";
  function normalize() {
    var secs = document.querySelectorAll(".sec"), k = scale || 1;

    (function () {

    });
  }
  var fit = document.getElementById("fit");
  function resize() {
    scale = Math.min(1, fit.clientWidth / 1426);

    fit.style.height = (panel.offsetHeight * scale) + "px";

    normalize();
  }
  window.addEventListener("resize", resize);

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
})();
</script>
